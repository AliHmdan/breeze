name: breezefood
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons:
  video_player:
  lottie:
  flutter_screenutil:
  pin_code_fields:
  geolocator: 
  shimmer:
  flutter_svg: 
  carousel_slider: 
  flutter_rating_bar:
  share_plus:
  flutter_slidable: 
  dotted_border: 
  google_maps_flutter: 
  flutter_easyloading: ^3.0.5
  image_picker: ^1.2.1
  flutter_bloc: ^8.1.4
  bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  dio: ^5.4.2+1
  easy_localization: ^3.0.7
  pretty_dio_logger: ^1.3.1
  retrofit: ^4.1.0
  json_annotation: ^4.9.0
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.2.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  iconsax: ^0.0.8
  file_picker:  
  location: ^8.0.1
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_local_notifications: ^19.5.0
  googleapis_auth:
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  cached_network_image: ^3.4.1
  photo_view:  
  flutter_cache_manager: ^3.4.1
  like_button: ^2.1.0
  scrollable_positioned_list: ^0.3.8
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter


  build_runner: ^2.4.9
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0
  flutter_launcher_icons: any
  intl: ^0.20.2
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logoBreezefood"
  min_sdk_android: 21
  remove_alpha_ios: true
  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/video/splachscreene.mp4
    - assets/video/login.mp4
    - assets/translations/
    - assets/b_driver/customer_map_point.png
    - assets/b_driver/driver_map_point.png
    - assets/b_driver/resturant_map_point.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/static/Inter_18pt-Medium.ttf
          weight: 500
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/static/Cairo-Bold.ttf
